{% extends "base.html" %}

{% block title %}编辑书籍 - 二手图书交易平台{% endblock %}

{% block content %}
<div class="form-container">
    <h2>编辑书籍</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">书名 *</label>
            <input type="text" id="title" name="title" value="{{ book.title }}" required>
        </div>
        
        <div class="form-group">
            <label for="author">作者 *</label>
            <input type="text" id="author" name="author" value="{{ book.author }}" required>
        </div>
        
        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn" value="{{ book.isbn or '' }}">
        </div>
        
        <div class="form-group">
            <label for="publisher">出版社</label>
            <input type="text" id="publisher" name="publisher" value="{{ book.publisher or '' }}">
        </div>
        
        <div class="form-group">
            <label for="condition">新旧程度 *</label>
            <select id="condition" name="condition" required>
                <option value="new" {% if book.condition == 'new' %}selected{% endif %}>全新</option>
                <option value="like_new" {% if book.condition == 'like_new' %}selected{% endif %}>几乎全新</option>
                <option value="good" {% if book.condition == 'good' %}selected{% endif %}>良好</option>
                <option value="acceptable" {% if book.condition == 'acceptable' %}selected{% endif %}>可接受</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="price">价格（元）*</label>
            <input type="number" id="price" name="price" step="0.01" min="0.01" value="{{ book.price }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="5">{{ book.description or '' }}</textarea>
        </div>
        
        {% if book.photo_paths %}
        <div class="form-group">
            <label>当前图片</label>
            {% set photos = book.photo_paths.split(',') %}
            {% for photo in photos[:4] %}
                <img src="{{ url_for('static', filename=photo) }}" alt="{{ book.title }}" style="max-width: 150px; margin-right: 10px;">
            {% endfor %}
        </div>
        {% endif %}
        
        <div class="form-group">
            <label for="pages">页数</label>
            <input type="number" id="pages" name="pages" value="{{ book.pages or '' }}" min="1" placeholder="请输入书籍总页数">
        </div>
        
        <div class="form-group">
            <label for="images">上传更多图片</label>
            <input type="file" id="images" name="images" accept="image/*" multiple>
            <small class="form-help">按住Ctrl键可选择多张图片</small>
        </div>
        
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('books.detail', book_id=book.id) }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
