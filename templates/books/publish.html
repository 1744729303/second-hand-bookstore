{% extends "base.html" %}

{% block title %}发布书籍 - 二手图书交易平台{% endblock %}

{% block scripts %}
<script>
    document.getElementById('ai-assess-btn').addEventListener('click', function() {
        const formData = new FormData();
        const cover = document.getElementById('cover_image').files[0];
        const titlePage = document.getElementById('title_page_image').files[0];
        const insidePages = document.getElementById('inside_page_images').files;
        const backCover = document.getElementById('back_cover_image').files[0];

        if (!cover || !titlePage || insidePages.length === 0 || !backCover) {
            alert('请先上传所有必须的照片 (封面, 扉页, 内页, 封底)');
            return;
        }

        formData.append('cover_image', cover);
        formData.append('title_page_image', titlePage);
        for (let i = 0; i < insidePages.length; i++) {
            formData.append('inside_page_images', insidePages[i]);
        }
        formData.append('back_cover_image', backCover);

        const btn = this;
        btn.disabled = true;
        btn.textContent = '正在评估...';

        fetch('/books/ai-assess', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('ai-assessment-result').style.display = 'block';
                document.getElementById('ai-condition-text').textContent = data.condition_text;
                document.getElementById('ai-reason-text').textContent = data.reason;
                
                // Auto-select the condition in the dropdown if it matches
                const conditionSelect = document.getElementById('condition');
                if (data.condition_value) {
                    conditionSelect.value = data.condition_value;
                }
            } else {
                alert('评估失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('评估请求出错');
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = 'AI 辅助成色评估';
        });
    });
</script>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>发布书籍</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">书名 *</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="author">作者 *</label>
            <input type="text" id="author" name="author" required>
        </div>
        
        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn">
        </div>
        
        <div class="form-group">
            <label for="publisher">出版社</label>
            <input type="text" id="publisher" name="publisher">
        </div>
        
        <div class="form-group">
            <label>书籍照片 (必须包含指定页面) *</label>
            
            <div class="image-upload-group">
                <label for="cover_image">封面 *</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*" required>
            </div>
            
            <div class="image-upload-group">
                <label for="title_page_image">扉页 *</label>
                <input type="file" id="title_page_image" name="title_page_image" accept="image/*" required>
            </div>
            
            <div class="image-upload-group">
                <label for="inside_page_images">内页 (可多张) *</label>
                <input type="file" id="inside_page_images" name="inside_page_images" accept="image/*" multiple required>
            </div>
            
            <div class="image-upload-group">
                <label for="back_cover_image">封底 *</label>
                <input type="file" id="back_cover_image" name="back_cover_image" accept="image/*" required>
            </div>
            
            <button type="button" id="ai-assess-btn" class="btn btn-info mt-2">AI 辅助成色评估</button>
            <div id="ai-assessment-result" class="mt-2" style="display:none;">
                <p><strong>AI 评估结果:</strong> <span id="ai-condition-text"></span></p>
                <p class="text-muted" id="ai-reason-text"></p>
            </div>
        </div>

        <div class="form-group">
            <label for="condition">新旧程度 *</label>
            <select id="condition" name="condition" required>
                <option value="">请选择</option>
                <option value="new">全新</option>
                <option value="like_new">几乎全新</option>
                <option value="good">良好</option>
                <option value="acceptable">可接受</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="price">价格（元）*</label>
            <input type="number" id="price" name="price" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
            <label for="stock_quantity">数量 *</label>
            <input type="number" id="stock_quantity" name="stock_quantity" min="1" value="1" required placeholder="请输入图书数量">
        </div>
        
        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="5" placeholder="描述书籍的状态、购买时间等信息"></textarea>
        </div>
        
        <div class="form-group">
            <label for="pages">页数 *</label>
            <input type="number" id="pages" name="pages" min="1" required placeholder="请输入书籍总页数">
        </div>
        
        <button type="submit" class="btn btn-primary">发布</button>
        <a href="{{ url_for('user.seller_center') }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
